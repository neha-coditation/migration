name: Neon worker integration tests
on:
  pull_request:
    paths:
      - server/neon/**
      - scripts/*neon*
      - scripts/run-page-worker.mjs
      - test/neon-*.test.mjs
      - .github/workflows/neon-*.yml
      - package*.json
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test API and database fencing without external services
        run: node --test test/neon-*.test.mjs
        env:
          NEON_WORKER_TEST_DATABASE_URL: postgresql://worker_test:local_test_only@127.0.0.1:5432/worker_test
