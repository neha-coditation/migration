name: Neon worker integration tests
on:
  pull_request:
    paths:
      - server/**
      - scripts/*neon*
      - scripts/run-page-worker.mjs
      - test/**
      - .github/workflows/neon-*.yml
      - package*.json
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test API and database fencing without external services
        run: npm test
        env:
          NEON_WORKER_TEST_DATABASE_URL: postgresql://worker_test:local_test_only@127.0.0.1:5432/worker_test
      - name: Install checking browser
        run: npx playwright install --with-deps chromium
      - name: Exercise real Astro build and browser QA on the controlled fixture
        run: npm run test:pipeline
      - name: Require actual browser evidence
        run: node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('test-results/fixture/report.json')); if(r.captureMode!=='browser'||r.qa.notRun||!r.qa.checks.length)process.exit(1)"
