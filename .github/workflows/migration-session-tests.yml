name: Migration session regression tests
on:
  pull_request:
    paths:
      - 'server/projects.mjs'
      - 'server/index.mjs'
      - 'public/projects.js'
      - 'public/index.html'
      - 'test/graceful-finish.test.mjs'
      - '.github/workflows/migration-session-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Validate controller and dashboard JavaScript
        run: |
          node --check server/projects.mjs
          node --check server/index.mjs
          node --check public/projects.js
